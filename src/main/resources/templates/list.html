<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=29b3650196f8fedd2d1e247efd58ae3f&libraries=services"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<meta charset="UTF-8">
<title>메인 화면(리스트)</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page_list">

<div class="header">

<div class="top_left_menu">
    <a th:href="@{/main}">
        <img th:src="@{/images/logo2.png}" alt="동네공구" class="button_img">
    </a>
</div>

    <div class="top_center_menu">
        <button type="button" id="Location_services">
            <span id="current_region" th:text="${selectedDong != null} ? ${selectedDong} : '내 지역 선택'">내 지역 선택</span>
        </button>
    </div>

    <div class="top_right_menu">
        <input type="button" id="myPage" name="myPage" value="마이페이지" th:onclick="|location.href='@{/mypage}'|">
        <button type="button" id="alarm" name="alarm">
            알림<span id="alarm_count">0</span>
        </button>
        <input type="button" id="logout" name="logout" value="로그아웃" th:onclick="|location.href='@{/logout}'|">
    </div>

</div>

<!-- 글 카드 리스트 -->
<div class="post_card_list">
    <a class="post_card" th:each="party : ${partyList}" th:href="@{/post/detail(partyNo=${party.partyNo})}">
        <div class="post_card_top_center">
            <p th:text="${party.partyNo}">글 번호</p>
            <h3 th:text="${party.partyTitle}">제목</h3>
            <p th:text="${party.userName}">작성자</p>
            <p th:text="${party.partyDateTime != null} ? ${#temporals.format(party.partyDateTime,'yyyy-MM-dd')} : ''">작성일</p>
        </div>
        <div class="post_card_top_right">
            <img th:if="${party.productImg != null}" th:src="@{${party.productImg}}" alt="상품 이미지">
        </div>
        <div class="post_card_center">
            <p th:text="${party.productName}">물품명</p>
            <p>[[${party.accumQty}]] / [[${party.targetQty}]]</p>
            <p th:text="${party.productPrice}">개당 가격</p>
        </div>
        <div class="post_card_bottom">
            <p th:text="${party.partyStatus}">상태</p>
        </div>
    </a>
</div>

<!-- 지역 선택 모달 -->
<div id="region_modal" style="display:none;">
    <select id="gu">
        <option value="">구 선택</option>
        <option value="구로구">구로구</option>
    </select>
    <select id="dong">
        <option value="">동 선택</option>
    </select>
    <button type="button" id="use_gps">현재 위치 선택</button>
    <button type="button" id="region_apply">선택 완료</button>
    <button type="button" id="modal_close">닫기</button>
</div>

<!-- 알림 모달 (카드 리스트) -->
<div id="alarm_modal" style="display:none;">
    <div class="alarm_card_list" id="alarm_card_list">
        <p>불러오는 중...</p>
    </div>
    <button type="button" id="alarm_read_all">모두 읽음</button>
    <button type="button" id="alarm_close">닫기</button>
</div>

<!-- 글쓰기 버튼 (화면 우하단에 떠 있음) -->
<input type="button" id="Post" name="Post" value="글쓰기" th:onclick="|location.href='@{/postform}'|">

<script type="text/javascript">
// 구별 동 목록 (행정동 기준 — 카카오 coord2RegionCode 의 H 결과와 맞춤)
const DONG_MAP = {
    "구로구": ["신도림동","구로1동","구로2동","구로3동","구로4동","구로5동",
               "가리봉동","고척1동","고척2동","개봉1동","개봉2동","개봉3동",
               "오류1동","오류2동","수궁동","항동"]
};

function fillDong(gu, selectedDong) {
    let $dong = $("#dong"); // jq로 지정한 값을 담기 위해서는 $변수명으로 해야함.
    $dong.empty().append('<option value="">동 선택</option>'); // .empty() 선택한 요소를 지우고 새 요소를 추가함.
    if (!DONG_MAP[gu]) return; // 만약 [gu]가 존재하지 않는다면 그냥 리턴.
    DONG_MAP[gu].forEach(function(d) { //구가 있다면 동을 차례로 반복,
        $dong.append('<option value="' + d + '">' + d + '</option>');
    });
    if (selectedDong) $dong.val(selectedDong); // 선택된 동을 동의 값으로 올린다.
}

$(function() {

    /* ---------- 지역 선택 ---------- */
    $("#Location_services").click(function() { // 지역 조회 버튼을 누르면
        $("#region_modal").show(); // 모달이 나옴
    });
    $("#modal_close").click(function() { // 닫기를 누르면
        $("#region_modal").hide(); // 숨겨짐
    });

    $("#gu").change(function() { //구를 바꾸면
        fillDong($(this).val(), null); //구에 해당되는 동을 찾고, 없으면 널값
    });

    $("#region_apply").click(function() { // region_apply 를 누른다면
        let gu = $("#gu").val();
        let dong = $("#dong").val();
        if (!gu) { alert("구를 선택해 주세요."); return; } // 선택 안했다면...
        location.href = "/?gu=" + encodeURIComponent(gu)
                      + "&dong=" + encodeURIComponent(dong || "");
    }); // 링크이동, 구와 동이 깨지지 않게 encodeURIComponent

    $("#use_gps").click(function() { //내 위치 자동조회. 이건 브라우저 기능임(카카오 아님)
        if (!navigator.geolocation) {
            alert("이 브라우저는 위치 조회를 지원하지 않습니다");
            return;
        }
        // getCurrentPosition 은 비동기. 호출 즉시 좌표를 주지 않고, 위치를 찾은 뒤 성공 콜백을 실행함.
        // 좌표는 콜백 안에서만 쓸 수 있음.
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                let lat = pos.coords.latitude;
                let lng = pos.coords.longitude;

                let geocoder = new kakao.maps.services.Geocoder();
                // coord2RegionCode(경도, 위도, 콜백) — 경도가 먼저임
                geocoder.coord2RegionCode(lng, lat, function(result, status) {
                    if (status !== kakao.maps.services.Status.OK) {
                        alert("주소를 가져오지 못했습니다");
                        return;
                    }
                    // 행정동(H) 결과 우선
                    let region = result.find(r => r.region_type === "H") || result[0];
                    let gu = region.region_2depth_name;
                    let dong = region.region_3depth_name;

                    if (!DONG_MAP[gu]) {
                        alert("현재 서비스 지역은 구로구입니다.\n현재 위치: " + gu + " " + dong);
                        return;
                    }
                    $("#gu").val(gu);
                    fillDong(gu, DONG_MAP[gu].includes(dong) ? dong : null);
                    if (!DONG_MAP[gu].includes(dong)) {
                        alert(gu + "로 설정했습니다. 동은 직접 선택해 주세요.");
                    }
                });
            },
            function(err) {
                alert("위치 권한이 거부되었습니다. 구/동을 직접 선택해 주세요.");
                console.log(err);
            }
        );
    });

    /* ---------- 알림 ---------- */
    function loadAlarmCount() { // 알람 카운트 함수
        $.getJSON("/alarm/count", function(res) { //get 요청을 보내고 json방식으로 받아올때, 콜백 함수로 res를 받아옴.
            $("#alarm_count").text(res.count); // 콜백함수로 받은 res.count를 텍스트로 넣어 화면에 보여줌
        });
    }

    function loadAlarmList() { //알람 리스트 로드 함수
        $.getJSON("/alarm/list", function(list) { //알람/리스트 를 get방식으로 요청하고 리스트로 받아옴
            if (!list || list.length === 0) { // 만약 없다면
                $("#alarm_card_list").html("<p>새 알림이 없습니다.</p>"); // 안내 문구를 넣어줌
                return;
            }
            let html = ""; // 빈 문자열 변수를 만듬.
            list.forEach(function(a) { // forEach 가 넘겨주는 임의의 매개변수 a. list 배열의 원소가 하나씩 들어옴.
                html +=
                '<div class="alarm_card' + (a.read ? '' : ' alarm_card_new') + '"'
                + ' data-alarm-id="' + a.alarmId + '"'
                + ' data-party-no="' + a.partyNo + '">'
                +   '<div class="alarm_card_top">'
                +     '<p>' + (a.type === "COMMENT" ? "댓글" : "신청") + '</p>'
                +     '<p>' + a.createdDate + '</p>'
                +   '</div>'
                +   '<div class="alarm_card_center">'
                +     '<p>' + a.message + '</p>'
                +   '</div>'
                + '</div>';

                // 읽었다면 빈 문자열, 읽지 않았다면 new 라는 클래스를 붙임
                // data-alarm-id 에 a.alarmId 를 붙여줌. 글에 대한 것도 똑같이
                // 알람 타입이 COMMENT 라면 댓글, 아니면 신청
                // message 는 "홍길동님이 댓글을 남겼습니다" 같은 안내 문구
            }); //위 형태로 알람이 만들어짐
            $("#alarm_card_list").html(html); // .html() 은 추가가 아니라 기존 내용을 통째로 교체함
        });
    }

    $("#alarm").click(function() {
        $("#alarm_modal").show();
        loadAlarmList();
    });
    $("#alarm_close").click(function() {
        $("#alarm_modal").hide();
    });

    // 카드 클릭 → 읽음 처리 후 해당 글로 이동
    $(document).on("click", ".alarm_card", function() { // 카드를 클릭하면 함수 발동.
    // $(".alarm_card").click(...) 과 결과가 다름. 요소를 찾는 시점이 다르기 때문.
    // document 는 HTML 전체를 의미함. 페이지 로딩이 끝나도 살아있으므로 알람이 나중에 추가돼도 잡아냄.
    // .click 은 그 줄을 읽는 순간 알람 카드가 없으면 아무 데도 안 붙음.
    //   (클릭하는 순간과 이 줄을 읽는 순간은 다름. 클릭 전에 이미 이 줄은 읽힘)
    // 직접 바인딩은 "이 줄이 실행되는 시점"에 요소를 찾고, 위임은 "클릭 시점"에 판별한다.
    // loadAlarmList() 가 다시 돌면 카드가 새로 그려지므로, 직접 바인딩은 그때마다 다시 등록해야 함.
        let alarmId = $(this).data("alarm-id"); // 방금 클릭한 알람에서 알람 아이디를 저장함. this(선택한 div 그 자체)
        let partyNo = $(this).data("party-no"); // 방금 클릭한 알람에서 그 글의 번호를 담음
        $.post("/alarm/read/" + alarmId, function() { // .post : 비동기 방식(자기 차례를 기다리지 않고 독립적으로 움직임)
                                                      // 서버 응답이 돌아온 뒤(콜백 안) 글로 이동함
                                                      // location.href 는 GET 방식이라 주소창에 보임
            location.href = "/post/detail?partyNo=" + partyNo;
        });
    });

    $("#alarm_read_all").click(function() { // 한번에 다 읽기를 누르면
        $.post("/alarm/readAll", function() { //포스트 방식으로 연결시켜주고
            loadAlarmList(); // 안 읽음 표시가 사라져야 하므로 다시 그림
            loadAlarmCount(); // 숫자가 0이 되어야 하므로 다시 가져옴
        });
    });

    loadAlarmCount(); // 페이지 열릴 때 한 번. 모달이 닫혀있든 열려있든 뱃지 숫자는 맞아야 함.
    setInterval(loadAlarmCount, 30000); // 30초마다 갱신
});
</script>

</body>
</html>
