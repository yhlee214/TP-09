<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=29b3650196f8fedd2d1e247efd58ae3f"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <meta charset="UTF-8">
    <title>글 상세</title>

</head>

<body>
    <div class="post_detail">
        <div class="post_detail_header">
            <p th:text="${post.postId}">글 번호</p>
            <h2 th:text="${post.title}">제목</h2>
            <p><span th:text="${post.writer}"> - </span><span th:text="${post.createdDate}"> - </span> </p>
            <div class="post_card_bottom">
                <p th:text="${post.state}">상태</p>

            </div>

            <form th:action="@{/post/delete}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?')">
                <input type="hidden" name="postId" th:value="${post.postId}">
                <button type="submit">삭제</button>
            </form>

        </div>
        <div class="post_detail_content">
            <p th:text="${post.itemName}">물품명</p>
            <p th:text="${post.price}">개당 가격</p>
            <p> 모집 현황 : [[${post.buyitem}]] / [[${post.totalitem}]]</p>
            <p th:text="${post.deadline}">마감일</p>
            <p th:text="${post.maxPerPerson}">1인당 최대 구매 수량</p>
        </div>
        <div class="trade_place">
            <p>거래 장소 : <span th:text="${post.placeName}"></span></p>
            <p th:text="${post.address}">주소</p>
            <input type="hidden" id="lat" th:value="${post.lat}">
            <input type="hidden" id="lng" th:value="${post.lng}">
            <div id="map" style="width:100%; height:350px;"></div>
        </div>
    </div>

    <form id="applyform" method="post" th:action="@{/apply}">
        <div class="applyform">
            <input type="hidden" name="postId" th:value="${post.postId}">

            <p>물품 명 : <span th:text="${post.itemName}"></span></p>
            <p>개당 가격 : <span th:text="${post.price}"></span></p>

            <label for="select_number">구매 개수</label>
            <input type="number" id="select_number" name="select_number" min="1" value="1"
                th:max="${post.maxPerPerson}">
            <input type="hidden" id="unitPrice" th:value="${post.price}">
            <p> 총 금액 : <span id="totalprice">0</span></p>
            <p> 신청자 : <span th:text="${session.loginUser.username}">ㅇㅇㅇ</span></p>
        </div>
        <button type="submit">신청하기</button>
    </form>

    <div class="comment">
        <form th:action="@{/comment/write}" method="post">
            <input type="hidden" name="postId" th:value="${post.postId}">
            <textarea name="content" placeholder="댓글 내용"></textarea>
            <button type="submit">등록</button>
        </form>

        <div th:each="c : ${commentList}">
            <p><span th:text="${c.commentId}"></span><span th:text="${c.writer}"></span> <span th:text="${c.createdDate}"></span></p>
            <p th:text="${c.content}"></p>
            <div>
                <input type="button" id="editcomment" name="editcomment" value="댓글 수정"
                    th:onclick="|location.href='@{/comment/edit(commentId=${c.commentId})}'|">
            </div>
            <form th:action="@{/comment/delete}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?')">
                <input type="hidden" name="commentId" th:value="${c.commentId}">
                <input type="hidden" name="postId" th:value="${post.postId}">
                <button type="submit">삭제</button>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        $(function () {
            let price = parseInt($("#unitPrice").val()) || 0; // 앞에게 false면 뒤에걸 선택해서 price에 넣음.

            $("#select_number").on("input", function () {
                $("#totalprice").text((parseInt($(this).val()) || 0) * price);
            }).trigger("input");

            let map, marker

            let lat = parseFloat($("#lat").val()) || 37.4954;
            let lng = parseFloat($("#lng").val()) || 126.8874;
            let pos = new kakao.maps.LatLng(lat, lng);
            let mapContainer = document.getElementById('map');
            map = new kakao.maps.Map(mapContainer, { // 맵 변수 안에 카카오 맵스 인터페이스 혹은 클래스 안에 맵이라는 함수를 통해 사용합니다, 이 함수 안에는 지도 그림을 담아둘 매게변수와 옵션을 요구합니다.
                center: pos, // 지도에 중앙을 보여줍니다. 위치는 구로구청 이며, 이는 초기세팅 값입니다.
                level: 3 // 지도의 확대 레벨을 설정합니다. 숫자가 클수록 지도가 축소됩니다}
            });

            marker = new kakao.maps.Marker({ // 마커를 새롭게 생성합니다.
                position: pos, // 마커의 위치를 pos설정합니다
                map: map // 마커를 지도에 표시하기 위해 설정합니다 
            })
        });
    </script>
</body>

</html>
